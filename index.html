<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071329" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spin & Dine" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/spin-dine-icon.svg" />
    <link rel="icon" href="./icons/spin-dine-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./wheel.css" />
    <title>Spin &amp; Dine</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <main id="screen" class="screen" aria-live="polite"></main>
      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" data-screen="tonight" aria-label="Tonight"><span>✦</span><small>Tonight</small></button>
        <button class="nav-item" data-screen="places" aria-label="Places"><span>⌖</span><small>Places</small></button>
        <button class="nav-item" data-screen="history" aria-label="History"><span>◷</span><small>History</small></button>
        <button class="nav-item" data-screen="settings" aria-label="Settings"><span>⚙</span><small>Settings</small></button>
      </nav>
    </div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
